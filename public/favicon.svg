<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="70%" stop-color="#071324" />
      <stop offset="100%" stop-color="#030810" />
    </radialGradient>
    
    <linearGradient id="ringCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="ringBlue" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#005da7" />
    </linearGradient>

    <linearGradient id="ringGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006d36" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#69f0ae" />
    </linearGradient>

    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cc" />
      <stop offset="35%" stop-color="#ffb300" />
      <stop offset="70%" stop-color="#ff6f00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Ambient Ambient Rings / Glow -->
  <g filter="url(#glow)" opacity="0.95">
    <!-- Outer Cyan Ring -->
    <ellipse cx="256" cy="256" rx="145" ry="145" fill="none" stroke="url(#ringCyan)" stroke-width="18" stroke-linecap="round" stroke-dasharray="720 180" transform="rotate(-25 256 256)" />
    
    <!-- Interlocking Blue Ring -->
    <ellipse cx="256" cy="256" rx="125" ry="125" fill="none" stroke="url(#ringBlue)" stroke-width="18" stroke-linecap="round" stroke-dasharray="620 160" transform="rotate(95 256 256)" />
    
    <!-- Interlocking Emerald Ring -->
    <ellipse cx="256" cy="256" rx="105" ry="105" fill="none" stroke="url(#ringGreen)" stroke-width="18" stroke-linecap="round" stroke-dasharray="520 140" transform="rotate(215 256 256)" />

    <!-- Innermost Momentum Arc -->
    <circle cx="256" cy="256" r="80" fill="none" stroke="#00f2fe" stroke-width="12" stroke-linecap="round" stroke-dasharray="380 120" opacity="0.85" transform="rotate(45 256 256)" />
  </g>

  <!-- Golden Core Flare -->
  <circle cx="256" cy="256" r="54" fill="url(#glowCore)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" opacity="0.95" filter="url(#glow)" />
</svg>